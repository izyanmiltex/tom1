    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://aryezmiltex.com" crossorigin>

    <link rel="preload" as="image" href="https://aryezmiltex.com/sellerialogo?v=2" fetchpriority="high">
    <link rel="preload" as="image" href="/assets/equestrian-saddle.jpg" fetchpriority="high">

    <!-- Schema.org Structured Data for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Selleria Luxury",
      "url": "https://selleriah.netlify.app",
      "logo": "https://aryezmiltex.com/sellerialogo?v=2",

      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "info@selleriahouse.com",
        "availableLanguage": ["English", "Hindi"]
      }
    }
    </script>

  <body class="bg-white text-neutral-900 antialiased selection:bg-[#1E5631] selection:text-white">
    <!-- Netlify static prerender form so Netlify Forms processes submissions to info@selleriahouse.com -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="country" />
      <input type="text" name="category" />
      <textarea name="message"></textarea>
      <input type="hidden" name="to_email" value="info@selleriahouse.com" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
